name: TeaVM browser verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  contracts:
    runs-on: [self-hosted, instanto-container]
    env:
      MAVEN_OPTS: ${{ matrix.mode == 'development' && '-Xmx3g' || '-Xmx4g' }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [development, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The parent POM and every Instanto snapshot, including teavm-compat, come from
      # packages.instanto.io. The profile lets Maven find the parent before reading it.
      - name: Configure package access
        run: |
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings>
            <servers>
              <server><id>forgejo-instanto</id><username>${env.FORGEJO_PACKAGE_USER}</username><password>${env.FORGEJO_PACKAGE_TOKEN}</password></server>
            </servers>
            <profiles><profile><id>instanto-snapshots</id>
              <repositories><repository><id>forgejo-instanto</id><url>https://packages.instanto.io/api/packages/instanto-io/maven</url><releases><enabled>false</enabled></releases><snapshots><enabled>true</enabled></snapshots></repository></repositories>
              <pluginRepositories><pluginRepository><id>forgejo-instanto</id><url>https://packages.instanto.io/api/packages/instanto-io/maven</url><releases><enabled>false</enabled></releases><snapshots><enabled>true</enabled></snapshots></pluginRepository></pluginRepositories>
            </profile></profiles>
            <activeProfiles><activeProfile>instanto-snapshots</activeProfile></activeProfiles>
          </settings>
          XML
      - name: Build TeaVM and analyze bytecode
        run: |
          if [ '${{ matrix.mode }}' = production ]; then
            mvn -B -ntp -U -Pproduction clean install
          else
            mvn -B -ntp -U -pl '!showcase-teavm,!build-verification' clean install
          fi
      - name: Compile the showcase in a fresh Maven process
        if: matrix.mode == 'development'
        run: mvn -B -ntp -f showcase-teavm/pom.xml clean install
      - name: Verify the assembled build
        if: matrix.mode == 'development'
        run: mvn -B -ntp -f build-verification/pom.xml clean install
      - name: Check grouped columns alone in TeaVM and Chrome
        timeout-minutes: 3
        run: mvn -B -ntp -f browser-tests/teavm/pom.xml '-Dtest=GalleryAdvancedStepsTest#scenario_The_original_table_columns_groups_example_renders*' test
      - name: Run Cucumber scenarios through TeaVM and Chrome
        timeout-minutes: 8
        run: |
          (
            while true; do
              if [ -r /sys/fs/cgroup/memory.current ]; then
                awk '{printf "Container memory: %.0f MiB\n", $1 / 1048576}' /sys/fs/cgroup/memory.current
              fi
              ps -eo pid,ppid,rss,comm --sort=-rss | head -12
              sleep 20
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          mvn -B -ntp -f browser-tests/teavm/pom.xml test
      - name: Run Cucumber scenarios through TeaVM and Firefox
        timeout-minutes: 12
        run: |
          (
            while true; do
              if [ -r /sys/fs/cgroup/memory.current ]; then
                awk '{printf "Container memory: %.0f MiB\n", $1 / 1048576}' /sys/fs/cgroup/memory.current
              fi
              ps -eo pid,ppid,rss,comm --sort=-rss | head -12
              sleep 20
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # A fresh browser process between groups bounds Firefox's retained
          # memory from loading the complete showcase in repeated frames.
          mvn -B -ntp -f browser-tests/teavm/pom.xml -Dtest=GalleryComponentsStepsTest -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
          mvn -B -ntp -f browser-tests/teavm/pom.xml -Dtest=GalleryAdvancedStepsTest -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
          mvn -B -ntp -f browser-tests/teavm/pom.xml -Dtest=LayoutStepsTest,NativeStepsTest,ReuseStepsTest,TableStepsTest,VisualReferenceStepsTest,WidgetStepsTest -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
      - name: Run the same scenarios through Java Playwright WebKit
        timeout-minutes: 20
        run: mvn -B -ntp -f browser-tests/webkit/pom.xml test
      - name: Verify native scrolling with Playwright Java
        run: mvn -B -ntp -f browser-tests/platform-checks/pom.xml test
      - name: Index analyzer results
        if: always()
        run: mvn -B -ntp -N io.instanto:domino-build-maven-plugin:0.1.0-SNAPSHOT:analysis -Ddomino.analysis.indexOnly=true
      - name: Record verification metadata
        run: mvn -B -ntp -N io.instanto:domino-build-maven-plugin:0.1.0-SNAPSHOT:record-results -Ddomino.mode=${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.mode }}
          path: |
            **/target/spotbugs/**
            **/target/surefire-reports*/**
            browser-tests/platform-checks/target/screenshots/**
            reports/**
            target/intake/inventory.json
            upstream/*lock.json
      - name: Assemble verified production showcases
        if: matrix.mode == 'production'
        run: mvn -B -ntp -Ppages -pl build-verification resources:copy-resources@pages
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'production'
        with:
          name: showcase-pages
          path: target/pages
