name: TeaVM browser verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  contracts:
    # GitHub withholds package credentials from fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure compatibility package access
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          echo "PACKAGES_READ_TOKEN=$PACKAGES_READ_TOKEN" >> "$GITHUB_ENV"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings><servers><server><id>forgejo</id><username>${env.FORGEJO_PACKAGE_USER}</username><password>${env.FORGEJO_PACKAGE_TOKEN}</password></server><server><id>github-cucumber-tea</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server><server><id>github-gherkin-tea</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server><server><id>github-mockatcha</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server></servers></settings>
          XML
      - name: Build TeaVM and analyze bytecode
        run: |
          if [ '${{ matrix.mode }}' = production ]; then
            mvn -B -ntp -Pproduction clean install
          else
            mvn -B -ntp clean install
          fi
      - name: Run Cucumber scenarios through TeaVM and Chrome
        run: mvn -B -ntp -f browser-tests/teavm/pom.xml test
      - name: Run Cucumber scenarios through TeaVM and Firefox
        run: mvn -B -ntp -f browser-tests/teavm/pom.xml -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
      - name: Run the same scenarios through Java Playwright WebKit
        run: mvn -B -ntp -f browser-tests/webkit/pom.xml test
      - name: Verify native scrolling with Playwright Java
        run: mvn -B -ntp -f browser-tests/platform-checks/pom.xml test
      - name: Index analyzer results
        if: always()
        run: mvn -B -ntp -N io.instanto:domino-build-maven-plugin:0.1.0-SNAPSHOT:analysis -Ddomino.analysis.indexOnly=true
      - name: Record verification metadata
        run: mvn -B -ntp -N io.instanto:domino-build-maven-plugin:0.1.0-SNAPSHOT:record-results -Ddomino.mode=${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.mode }}
          path: |
            **/target/spotbugs/**
            **/target/surefire-reports*/**
            browser-tests/platform-checks/target/screenshots/**
            reports/**
            target/intake/inventory.json
            upstream/*lock.json
      - name: Assemble verified production showcases
        if: matrix.mode == 'production'
        run: mvn -B -ntp -Ppages -pl build-verification resources:copy-resources@pages
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'production'
        with:
          name: showcase-pages
          path: target/pages
