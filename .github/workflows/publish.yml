name: Publish development Maven artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: [self-hosted, instanto-container]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
      - name: Check out the shared development parent
        uses: actions/checkout@v4
        with:
          repository: instanto-io/instanto-poms
          path: .build/instanto-poms
      - name: Install the shared development parent
        run: mvn -B -ntp -f .build/instanto-poms/pom.xml install
      - name: Check out the development compatibility libraries
        uses: actions/checkout@v4
        with:
          repository: instanto-io/teavm-compat
          path: .build/teavm-compat
      - name: Install the development compatibility libraries
        run: mvn -B -ntp -f .build/teavm-compat/pom.xml -DskipTests -Dspotbugs.skip=true install
      - name: Configure compatibility package access
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "PACKAGES_READ_TOKEN=$PACKAGES_READ_TOKEN" >> "$GITHUB_ENV"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server><server><id>github-teavm-compat</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server><server><id>github-cucumber-tea</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server><server><id>github-gherkin-tea</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server><server><id>github-mockatcha</id><username>${env.GITHUB_ACTOR}</username><password>${env.PACKAGES_READ_TOKEN}</password></server></servers></settings>
          XML

      - run: mvn -B -ntp -Pproduction,documentation clean install
      - name: Install browser engines through Java
        run: mvn -B -ntp -f browser-tests/webkit/pom.xml org.codehaus.mojo:exec-maven-plugin:3.6.3:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install chromium firefox webkit"
      - name: Run Cucumber scenarios through TeaVM and Chrome
        run: mvn -B -ntp -f browser-tests/teavm/pom.xml test
      - name: Run Cucumber scenarios through TeaVM and Firefox
        run: mvn -B -ntp -f browser-tests/teavm/pom.xml -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
      - name: Run the same scenarios through Java Playwright WebKit
        run: mvn -B -ntp -f browser-tests/webkit/pom.xml test
      - name: Verify native scrolling with Playwright Java
        run: mvn -B -ntp -f browser-tests/platform-checks/pom.xml test
      - run: mvn -B -ntp -Pproduction,documentation deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Consume published artifacts from an empty Maven repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -R examples "$RUNNER_TEMP/domino-external"
          mvn -B -ntp -U -f "$RUNNER_TEMP/domino-external/pom.xml" -Dmaven.repo.local="$RUNNER_TEMP/domino-m2" clean verify
      - name: Verify the published consumer in all three browsers
        run: |
          mvn -B -ntp -f browser-tests/teavm/pom.xml -Dtest=ExternalStepsTest -Ddomino.external.root="$RUNNER_TEMP/domino-external" test
          mvn -B -ntp -f browser-tests/teavm/pom.xml -Dtest=ExternalStepsTest -Ddomino.external.root="$RUNNER_TEMP/domino-external" -Dbrowser.engine=firefox -Dteavm.junit.js.runner=browser-firefox test
          mvn -B -ntp -f browser-tests/webkit/pom.xml -Dtest=ExternalStepsTest -Ddomino.external.root="$RUNNER_TEMP/domino-external" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-consumer-verification
          path: browser-tests/**/target/surefire-reports*/**
