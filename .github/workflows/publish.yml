name: Publish development Maven artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshots:
    name: packages.instanto.io
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Domino snapshots
      goals: clean deploy
      maven-args: -pl '!showcase-teavm,!build-verification'
      fast-deploy: true
      downstream-checks: false
      sonar: false
      timeout-minutes: 30
    secrets: inherit

  consumer:
    name: Published Domino example
    if: github.event_name == 'workflow_dispatch'
    needs: snapshots
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Build the example from published snapshots
      goals: clean verify
      downstream-checks: false
      sonar: false
      maven-args: -f examples/pom.xml -Dmaven.repo.local=$RUNNER_TEMP/domino-consumer-m2
      timeout-minutes: 30
    secrets: inherit
