name: Publish development Maven artifacts

on:
  workflow_run:
    workflows: [ TeaVM browser verification ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshots:
    name: packages.instanto.io
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Domino snapshots
      goals: clean deploy
      maven-args: -pl '!showcase-teavm,!build-verification' -DskipTests -Dspotbugs.skip=true
      timeout-minutes: 30
    secrets: inherit

  consumer:
    name: Published Domino example
    needs: snapshots
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Build the example from published snapshots
      goals: clean verify
      maven-args: -f examples/pom.xml -Dmaven.repo.local=$RUNNER_TEMP/domino-consumer-m2
      timeout-minutes: 30
    secrets: inherit
